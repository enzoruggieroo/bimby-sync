name: Sincronizza spesa Bimby

on:
  schedule:
    # Ogni 30 minuti (:07 e :37), dalle 4 alle 21 UTC:
    # circa 5–23 con l'ora solare, 6–24 con l'ora legale.
    # Nei repository pubblici GitHub Actions non consuma minuti a pagamento.
    - cron: "7,37 4-21 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Prova a secco: mostra cosa farebbe senza modificare nulla"
        type: boolean
        default: false
      comprati:
        description: "Righe spuntate in Promemoria, una per riga: vengono segnate in Cookidoo come già in casa"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python sync.py
        env:
          COOKIDOO_EMAIL: ${{ secrets.COOKIDOO_EMAIL }}
          COOKIDOO_PASSWORD: ${{ secrets.COOKIDOO_PASSWORD }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
